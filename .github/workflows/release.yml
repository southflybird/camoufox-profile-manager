name: Custom Windows release

on:
  push:
    tags: ['custom-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'southflybird/camoufox-profile-manager'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra build --extra sync
      - name: Validate custom package identity
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            uv run --no-sync python scripts/verify_custom_release.py --tag $env:RELEASE_TAG
          } else {
            uv run --no-sync python scripts/verify_custom_release.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: choco install nsis --no-progress -y
      - run: uv run --no-sync python scripts/build_desktop.py --package
      - run: uv run --no-sync python scripts/smoke_desktop_recovery.py
      - name: Verify isolated installer lifecycle
        run: uv run --no-sync python scripts/windows_installer_acceptance.py dist/cpm-custom-windows-x86_64-setup.exe --output windows-installer.json
      - uses: actions/upload-artifact@v7
        with:
          name: cpm-custom-windows-x86_64
          path: |
            dist/cpm-custom-windows-x86_64-setup.exe
            dist/cpm-custom-windows-x86_64-setup.exe.sha256
            windows-installer.json
      - name: Prepare a draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            dist/cpm-custom-windows-x86_64-setup.exe
            dist/cpm-custom-windows-x86_64-setup.exe.sha256
